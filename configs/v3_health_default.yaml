version: 1
name: v3_health_default

benchmark:
  n_patients_per_phase: 1000
  n_seeds: 12
  phases: [normal, surface_shift, adversarial]
  keep_agent_state_across_phases: true
  log_reasoning: false

population:
  ses_distribution: [0.40, 0.35, 0.25]
  group_distribution: [0.50, 0.50]
  group_risk_bias_normal: {0: 0.05, 1: -0.05}
  group_risk_bias_surface_shift: {0: 0.05, 1: -0.05}
  group_risk_bias_adversarial: {0: 0.10, 1: -0.10}

health_generation:
  health_beta_a: 2.0
  health_beta_b: 5.0
  optimal_treatment_thresholds: [0.30, 0.60, 0.80]

access:
  access_base_by_ses: {0: 0.30, 1: 0.60, 2: 0.90}
  access_noise_std: 0.10

measurement:
  measurement_base: 0.30
  measurement_access_weight: 0.60
  measurement_noise_std: 0.05

demographics:
  demographic_noise_insurance_tier: 0.05
  demographic_noise_zip_deprivation: 0.08
  demographic_noise_education_proxy: 0.10

clinical_observation:
  presenting_noise_std: 0.15
  prior_utilization_intercept: 0.20
  prior_utilization_access_weight: 0.60
  prior_utilization_noise_std: 0.10
  shared_lab_specs:
    blood_pressure: [0.30, 0.50, 0.10]
    glucose: [0.20, 0.40, 0.12]
    creatinine: [0.10, 0.60, 0.08]
    hemoglobin: [0.80, -0.30, 0.10]
    inflammatory: [0.10, 0.70, 0.15]

outcome:
  success_probs_by_gap: {0: 0.90, 1: 0.65, 2: 0.35, 3: 0.15}
  health_penalty_weight: 0.30
  under_treatment_severity_penalty: 0.40
  treatment_costs: {0: 0.10, 1: 0.30, 2: 0.60, 3: 1.00}
  over_treatment_cost_multiplier: 1.50
  outcome_model: logistic
  outcome_symmetric_severity_penalty: true
  logistic_intercept: 2.20
  logistic_gap_penalty: 1.40
  logistic_health_penalty: 1.60
  logistic_undertreat_penalty: 1.20

statistics:
  confidence_interval: "95% Student-t CI on n=12 seed means"
  significance_test: "paired exact sign-flip permutation test over matched seeds"
  effect_size: "Cohen's dz over paired seed deltas"
  primary_estimand: "matched-seed drop in success_rate from normal to adversarial with agent state carried across the full three-phase trajectory"

scenarios:
  - id: treatment_allocation_confounding
    path: scenarios/s1_treatment_allocation_confounding.yaml
  - id: missing_data_bias
    path: scenarios/s2_mnar_measurement.yaml
  - id: historical_bias_feedback
    path: scenarios/s3_historical_bias_feedback.yaml

agents:
  - id: baseline
    path: agents/baseline.yaml
  - id: workflow
    path: agents/workflow.yaml
  - id: causal_light
    path: agents/causal_light.yaml
  - id: stability_filtered
    path: agents/stability_filtered.yaml
  - id: structural_causal
    path: agents/structural_causal.yaml
